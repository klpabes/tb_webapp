{% extends "app/layout.html" %}
{% load crispy_forms_tags %}

{% block title %}
ARIMA
{% endblock %}

{% block body %}
  <div class="content-section">
    <form method="POST" >
      {% csrf_token %}
      <fieldset class="form-group">
        <legend class="border-bottom mb-4">ARIMA</legend>
        {{ form|crispy }}
      </fieldset>
      <div class="form-group">
        <button class="btn btn-outline-info" type="submit">
        Predict
        </button>
      </div>
      <h1>Predicted Cases: {{ pred }} </h1>
    </form>
  </div>
{% endblock body %}
